<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anesthesia Care API</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #f6f8fc;
        color: #1d2b4f;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(680px, calc(100vw - 32px));
        padding: 32px;
        border: 1px solid #dde5f2;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 16px 50px rgb(27 46 92 / 8%);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 18px;
        color: #53617f;
        line-height: 1.6;
      }

      ul {
        margin: 0;
        padding-left: 20px;
      }

      li {
        margin: 8px 0;
      }

      code,
      a {
        color: #225bd8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Anesthesia Care API</h1>
      <p>Backend online. Use os endpoints REST abaixo no app ou no Insomnia.</p>
      <ul>
        <li><a href="/api/health"><code>GET /api/health</code></a></li>
        <li><code>POST /api/auth/register</code></li>
        <li><code>POST /api/auth/login</code></li>
        <li><code>GET /api/patients</code></li>
        <li><code>GET /api/products</code></li>
        <li><code>GET /api/medications</code></li>
      </ul>
    </main>
  </body>
</html>
